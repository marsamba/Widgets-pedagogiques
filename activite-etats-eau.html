<header><h1>Les trois états de l’eau</h1></header>

<p id="status" role="status" aria-live="polite"></p>

</div>

const positions=new Map();let selected=null;let dragId=null;
const status=document.getElementById('status');
const names={liquid:'liquide',solid:'solide',gas:'gazeux',bank:'cartes à classer'};
function clearFeedback(){document.querySelectorAll('.card').forEach(el=>{el.classList.remove('good','bad');el.querySelector('.mark').textContent='';});document.getElementById('feedback').hidden=true;}
function select(id){selected=selected===id?null:id;document.querySelectorAll('.card').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.id===selected)));status.textContent=selected?'Carte sélectionnée : '+cards.find(c=>c.id===selected).label+'. Choisis une colonne.':'Sélection annulée.';}
function move(id,zone){if(!cards.some(c=>c.id===id)||!Object.hasOwn(names,zone))return;clearFeedback();document.getElementById(zone).append(document.getElementById('card-'+id));positions.set(id,zone);selected=null;document.querySelectorAll('.card').forEach(el=>el.setAttribute('aria-pressed','false'));const remaining=[...positions.values()].filter(x=>x==='bank').length;status.textContent='Carte placée dans « '+names[zone]+' ». '+(remaining?remaining+' carte(s) à classer.':'Toutes les cartes sont classées. Tu peux vérifier.');}
function reset(){selected=null;dragId=null;document.getElementById('feedback').hidden=true;document.getElementById('explanations').replaceChildren();Object.keys(names).forEach(z=>document.getElementById(z).replaceChildren());const shuffled=[...cards];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}shuffled.forEach(c=>{positions.set(c.id,'bank');const el=document.createElement('button');el.type='button';el.className='card';el.id='card-'+c.id;el.dataset.id=c.id;el.draggable=true;el.setAttribute('aria-pressed','false');const icon=document.createElement('img');icon.className='photo';icon.src=c.image;icon.alt='';icon.draggable=false;const label=document.createElement('span');label.textContent=c.label;const mark=document.createElement('span');mark.className='mark';el.append(icon,label,mark);el.addEventListener('click',()=>select(c.id));el.addEventListener('dragstart',e=>{dragId=c.id;e.dataTransfer.setData('text/plain',c.id);e.dataTransfer.effectAllowed='move';});el.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.over').forEach(z=>z.classList.remove('over'));});document.getElementById('bank').append(el);});status.textContent='';}
document.querySelectorAll('[data-place]').forEach(b=>b.addEventListener('click',()=>{if(selected)move(selected,b.dataset.place);else status.textContent='Choisis d’abord une carte.';}));
document.querySelectorAll('[data-zone]').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';z.classList.add('over');});z.addEventListener('dragleave',e=>{if(!z.contains(e.relatedTarget))z.classList.remove('over');});z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');move(e.dataTransfer.getData('text/plain')||dragId,z.dataset.zone);});});
document.getElementById('check').addEventListener('click',()=>{clearFeedback();let good=0,missing=0;cards.forEach(c=>{const el=document.getElementById('card-'+c.id);const pos=positions.get(c.id);if(pos==='bank'){missing++;return;}const ok=pos===c.state;if(ok)good++;el.classList.add(ok?'good':'bad');el.querySelector('.mark').textContent=ok?'✓ Correct':'À revoir';});status.textContent=good===cards.length?'Bravo ! 12 réponses correctes sur 12.':good+' réponse(s) correcte(s) sur 12. '+(missing?missing+' carte(s) encore à classer. ':'')+'Tu peux déplacer les cartes et réessayer.';});
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('answer').addEventListener('click',()=>{cards.forEach(c=>move(c.id,c.state));document.getElementById('check').click();status.textContent='Correction affichée : les cartes sont dans leur bonne colonne.';const list=document.getElementById('explanations');list.replaceChildren();cards.forEach(c=>{const li=document.createElement('li');li.textContent=c.label+' : '+c.why;list.append(li);});document.getElementById('feedback').hidden=false;});
reset();
</script></body></html>
