<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>La lettre r — activité interactive</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff9f5;color:#26323a}.wrap{max-width:950px;margin:auto;padding:28px}h1{color:#dc6538;font-size:clamp(24px,3vw,36px);margin:0 0 10px}.intro{font-size:20px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#dc7048;border:3px solid #dc7048;border-radius:12px;overflow:hidden}.cell{min-height:95px;background:white;border:0;font-size:clamp(18px,2.6vw,27px);cursor:pointer;padding:12px;transition:background .15s}.cell.selected{background:#add9ad}.cell.correct{box-shadow:inset 0 0 0 5px #268044}.cell.wrong{box-shadow:inset 0 0 0 5px #c73f3f}.cell:focus-visible,button:focus-visible{outline:4px solid #2466a8;outline-offset:-4px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}button.action{border:0;border-radius:10px;padding:14px 20px;font-size:18px;font-weight:bold;cursor:pointer;background:#d96942;color:white}button.secondary{background:#466978}.feedback{min-height:55px;margin-top:16px;font-size:20px;font-weight:bold}.hint{color:#59666d;font-size:16px}@media(max-width:500px){.wrap{padding:14px}.cell{min-height:78px}.actions button{flex:1}}
</style></head><body><main class="wrap"><h1>④ Colorie quand tu entends « r » à la fin des mots.</h1><p class="intro">Clique sur les cases pour les colorier en vert.</p><section class="grid" id="grid" aria-label="Mots à sélectionner"></section><div class="actions"><button class="action" id="check">Vérifier mes réponses</button><button class="action secondary" id="reveal">Afficher la correction</button><button class="action secondary" id="reset">Recommencer</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><p class="hint">Prototype inspiré de la page 9 du PDF « Chap 4 Activ inspire ». Les réponses ne sont pas enregistrées.</p></main>
<script>
const words=[{"word": "manger", "answer": false}, {"word": "cher", "answer": true}, {"word": "chanter", "answer": false}, {"word": "avancer", "answer": false}, {"word": "la mer", "answer": true}, {"word": "salir", "answer": true}, {"word": "un danger", "answer": true}, {"word": "rugir", "answer": true}, {"word": "travailler", "answer": false}, {"word": "le cuir", "answer": true}, {"word": "l’horreur", "answer": true}, {"word": "un fermier", "answer": true}];const grid=document.getElementById('grid'),feedback=document.getElementById('feedback');let chosen=new Set();
function draw(mode='normal'){grid.innerHTML='';words.forEach((item,i)=>{const b=document.createElement('button');b.className='cell';b.type='button';b.textContent=item.word;b.setAttribute('aria-pressed',chosen.has(i));if(chosen.has(i))b.classList.add('selected');if(mode==='check'&&chosen.has(i))b.classList.add(item.answer?'correct':'wrong');if(mode==='reveal'){b.classList.toggle('selected',item.answer);b.classList.add(item.answer?'correct':'');}b.onclick=()=>{chosen.has(i)?chosen.delete(i):chosen.add(i);feedback.textContent='';draw();};grid.appendChild(b);});}
document.getElementById('check').onclick=()=>{const n=words.filter((w,i)=>w.answer===chosen.has(i)).length;draw('check');feedback.textContent=n===words.length?'Bravo ! Toutes les réponses sont correctes.':n+' réponses correctes sur '+words.length+'. Tu peux modifier ta sélection.';};
document.getElementById('reveal').onclick=()=>{draw('reveal');feedback.textContent='Correction : les cases vertes correspondent aux mots où le son « r » est entendu à la fin.';};
document.getElementById('reset').onclick=()=>{chosen.clear();feedback.textContent='';draw();};draw();
</script></body></html>
