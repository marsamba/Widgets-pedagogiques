        <nav class="tools" aria-label="Boutons de l’application">
          <a class="tool" href="#sommaire" data-nav="sommaire"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7M5 10v10h5v-6h4v6h5V10"/></svg><span>Sommaire</span></a>
